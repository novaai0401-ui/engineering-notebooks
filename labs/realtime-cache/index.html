<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realtime classroom</title><style>body{max-width:760px;margin:35px auto;padding:20px;font:18px/1.6 system-ui;color:#18313f;background:#fffdf8}label,input,textarea{display:block}input,textarea,button{font:inherit;padding:9px;max-width:100%;box-sizing:border-box}button{margin:8px 8px 8px 0}*:focus-visible{outline:3px solid #095769}#error{color:#a20c16}</style><main><h1>Realtime classroom</h1><p>A private event journal. Compare replayable SSE with bidirectional WebSockets.</p><form id="login"><label for="user">Learner</label><input id="user" value="alice" required><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><section id="workspace" hidden><h2>Your messages</h2><form id="post"><label for="text">Message</label><textarea id="text" maxlength="500" required></textarea><button>Publish</button></form><button id="sse">Connect SSE</button><button id="ws">Connect WebSocket</button><button id="snapshot">Refresh snapshot</button><button id="logout">Sign out</button><p role="status" id="status">Signed in</p><ul id="messages"></ul></section><p role="alert" id="error"></p></main><script>
let csrf='',cursor=0,stream=null,socket=null;const rows=new Map(),el=id=>document.getElementById(id);
function disconnect(){stream?.close();socket?.close();stream=null;socket=null;}
function draw(row){rows.set(row.seq,row.text);cursor=Math.max(cursor,row.seq);el('messages').replaceChildren(...[...rows].sort((a,b)=>a[0]-b[0]).map(([n,t])=>{const li=document.createElement('li');li.textContent=n+': '+t;return li;}));}
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('Request rejected ('+r.status+'). Sign in again or refresh the snapshot.');return r.json();}
async function action(fn){el('error').textContent='';try{await fn();}catch(e){el('error').textContent=e.message;}}
el('login').onsubmit=e=>{e.preventDefault();action(async()=>{const session=await request('/login',{user:el('user').value,password:el('password').value});csrf=session.csrf;el('password').value='';el('login').hidden=true;el('workspace').hidden=false;});};
el('post').onsubmit=e=>{e.preventDefault();action(async()=>{await request('/messages',{key:crypto.randomUUID(),text:el('text').value});el('text').value='';});};
el('snapshot').onclick=()=>action(async()=>{const snap=await request('/snapshot');rows.clear();el('messages').replaceChildren();cursor=snap.revision;snap.messages.forEach(draw);el('status').textContent='Snapshot revision '+cursor;});
el('sse').onclick=()=>{disconnect();stream=new EventSource('/events?after='+cursor);stream.onmessage=e=>{draw(JSON.parse(e.data));el('status').textContent='SSE received revision '+cursor;};stream.addEventListener('reset',()=>{disconnect();el('error').textContent='History or session expired. Refresh the snapshot or sign in again.';});stream.onerror=()=>el('status').textContent='SSE reconnecting; displayed messages may be stale.';};
el('ws').onclick=()=>{disconnect();socket=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws?after='+cursor);socket.onopen=()=>el('status').textContent='WebSocket connected';socket.onmessage=e=>{const message=JSON.parse(e.data);if(message.type==='message'){draw(message);el('status').textContent='WebSocket received revision '+cursor;}};socket.onclose=()=>el('status').textContent='WebSocket disconnected; refresh or reconnect.';};
el('logout').onclick=()=>action(async()=>{await request('/logout',{});disconnect();csrf='';cursor=0;rows.clear();el('messages').replaceChildren();el('workspace').hidden=true;el('login').hidden=false;});window.addEventListener('pagehide',disconnect);
</script></html>
