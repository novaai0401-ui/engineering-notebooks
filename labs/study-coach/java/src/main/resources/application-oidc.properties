coach.auth-mode=oidc
server.servlet.session.cookie.same-site=lax
spring.security.oauth2.client.registration.coach.client-id=study-coach
spring.security.oauth2.client.registration.coach.client-secret=${COACH_OIDC_SECRET}
spring.security.oauth2.client.registration.coach.scope=openid,profile,email
spring.security.oauth2.client.registration.coach.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.coach.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.coach.issuer-uri=${COACH_ISSUER:http://127.0.0.1:8094/realms/study}
