server.address=127.0.0.1
server.port=${COACH_PORT:8091}
spring.datasource.url=${COACH_DB:jdbc:h2:file:./data/coach}
spring.datasource.username=${COACH_DB_USER:sa}
spring.datasource.password=${COACH_DB_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.locations=${COACH_MIGRATIONS:classpath:db/migration}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
coach.auth-mode=basic
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.async.request-timeout=30000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
coach.password=${COACH_PASSWORD}
coach.service-token=${COACH_SERVICE_TOKEN}
coach.ai-url=${COACH_AI_URL:http://127.0.0.1:8092/answer}
coach.worker-enabled=${COACH_WORKER_ENABLED:true}
coach.lease-ms=${COACH_LEASE_MS:15000}
coach.ai-read-timeout-ms=${COACH_AI_READ_TIMEOUT_MS:2000}
coach.ai-deadline-ms=${COACH_AI_DEADLINE_MS:8000}
spring.activemq.broker-url=${COACH_BROKER_URL:tcp://127.0.0.1:61629}
spring.activemq.user=coach
spring.activemq.password=${COACH_BROKER_PASSWORD:unused-without-broker-profile}
spring.jms.template.delivery-mode=persistent
spring.jms.template.explicit-qos-enabled=true
